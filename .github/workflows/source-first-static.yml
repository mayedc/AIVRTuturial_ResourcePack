name: Source-first repository checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-source-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source-first kit, links and scene spec (no Unity license required)
        run: python Tools/Validation/validate_source_first.py
      - name: Audit tracked public-release text and machine-local content
        run: python Tools/Validation/audit_public_release.py
